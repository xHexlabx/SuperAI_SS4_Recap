[project]
name = "sleep-stage"
version = "0.1.0"
description = "Sleep Stages Classification — 3-class W/N/R from an Empatica E4 wristband (SuperAI SS4 Individual Hack 5, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "torch>=2.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "seaborn>=0.13"]

[project.scripts]
sleep-download = "sleep_stage.cli:download_main"
sleep-cache = "sleep_stage.cli:cache_main"
sleep-train = "sleep_stage.cli:train_main"
sleep-predict = "sleep_stage.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_stage"]

[tool.uv]
package = true
