[project]
name = "legal-act"
version = "0.1.0"
description = "Legal Act Classification — LLM-compiled signing rules (SuperAI SS4 L2 Hack 3, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "httpx>=0.27",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "matplotlib>=3.9"]
# local Qwen server — heavy (torch + CUDA wheels), so it lives behind an extra
serve = ["vllm>=0.6"]

[project.scripts]
legal-download = "legal_act.cli:download_main"
legal-compile = "legal_act.cli:compile_main"
legal-eval = "legal_act.cli:eval_main"
legal-predict = "legal_act.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_act"]

[tool.uv]
package = true
