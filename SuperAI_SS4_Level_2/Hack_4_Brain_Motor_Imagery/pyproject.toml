[project]
name = "brain-mi"
version = "0.1.0"
description = "Brain Motor Imagery — 3-class MI-EEG classification (SuperAI SS4 L2 Hack 4, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "mne>=1.8",
    "pyriemann>=0.7",
    "braindecode>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "seaborn>=0.13"]

[project.scripts]
mi-download = "brain_mi.cli:download_main"
mi-train = "brain_mi.cli:train_main"
mi-predict = "brain_mi.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mi"]

[tool.uv]
package = true
