[project]
name = "liver-us"
version = "0.1.0"
description = "Liver Ultrasound Detection — focal liver lesion detection (SuperAI SS4 L2 Hack 6, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "ensemble-boxes>=1.0.9",
    "pycocotools>=2.0.8",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "seaborn>=0.13"]

[project.scripts]
liver-download = "liver_us.cli:download_main"
liver-prepare = "liver_us.cli:prepare_main"
liver-train = "liver_us.cli:train_main"
liver-predict = "liver_us.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liver_us"]

[tool.uv]
package = true
