[project]
name = "image-search"
version = "0.1.0"
description = "Image Search — zero-shot logo retrieval (SuperAI SS4 L1 Hack 1, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "transformers>=4.56",
    "open-clip-torch>=2.30",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "seaborn>=0.13"]

[project.scripts]
img-download  = "img_search.cli:download_main"
img-embed     = "img_search.cli:embed_main"
img-map       = "img_search.cli:map_main"
img-benchmark = "img_search.cli:benchmark_main"
img-predict   = "img_search.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img_search"]

[tool.uv]
package = true
