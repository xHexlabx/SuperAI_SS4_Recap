[project]
name = "uwb-pose"
version = "0.1.0"
description = "UWB Pose Prediction — signal-to-image classification (SuperAI SS4 L1 Hack 3, local rebuild)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pywavelets>=1.6",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "seaborn>=0.13"]

[project.scripts]
uwb-download = "uwb_pose.cli:download_main"
uwb-train = "uwb_pose.cli:train_main"
uwb-predict = "uwb_pose.cli:predict_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uwb_pose"]

[tool.uv]
package = true
